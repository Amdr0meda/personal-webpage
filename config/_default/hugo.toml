title = "Carlos Muñoz Torrijos"
baseurl = "https://www.carlosmunoztorrijos.com/"
canonifyURLs = false
disableAliases = false # necesario para redirigir las URLs antiguas
disableHugoGeneratorInject = true
# disableKinds = ["taxonomy", "term"]
enableEmoji = true
enableGitInfo = false
timeZone = "Europe/Madrid"
enableRobotsTXT = true
languageCode = "es-ES"
rssLimit = 10
summarylength = 40

# Idioma
defaultContentLanguage = "es"
defaultContentLanguageInSubdir = false

copyright = "Carlos Muñoz Torrijos"

[pagination]
  pagerSize = 10

[build.buildStats]
  enable = true

[outputs]
  home = ["HTML", "RSS", "searchIndex"]
  section = ["HTML", "RSS", "SITEMAP"]

[outputFormats.searchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

# Add output format for section sitemap.xml
[outputFormats.SITEMAP]
  mediaType = "application/xml"
  baseName = "sitemap"
  isHTML = false
  isPlainText = true
  noUgly = true
  rel  = "sitemap"

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

[caches]
  [caches.getjson]
    dir = ":cacheDir/:project"
    maxAge = -1 # "30m"

[taxonomies]
  tag = "tags"

[permalinks]
  blog = "/blog/:slug/"
  docs = "/docs/:slug/"
# docs = "/docs/1.0/:sections[1:]/:slug/"

[minify.tdewolff.html]
  keepWhitespace = false

[related]
  threshold = 80
  includeNewer = true
  toLower = false
    [[related.indices]]
      name = "categories"
      weight = 100
    [[related.indices]]
      name = "tags"
      weight = 80
    [[related.indices]]
      name = "date"
      weight = 10

[imaging]
  anchor = "Center"
  bgColor = "#ffffff"
  hint = "photo"
  quality = 85
  resampleFilter = "Lanczos"

# Publicar solo las imágenes procesadas (WebP), no los originales de cada post.
# Los que se usan directamente (p. ej. cover.png para redes sociales) se publican igualmente.
[[cascade]]
  [cascade.build]
    publishResources = false
